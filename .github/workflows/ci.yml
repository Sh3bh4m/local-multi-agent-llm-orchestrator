name: Node.js verification

on:
  push:
    branches:
      - main
      - fix/local-inference-reliability
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax
        run: npm run check
      - name: Run regression suite
        run: npm test
